<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR AI GENERATOR · v25.0 | ULTRA-REALISTIC</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pure-white:#FFFFFF;
  --soft-glow:#F8F9FA;
  --deep-black:#050505;
  --mid-grey:#1A1A1A;
  --accent-gold:#D4AF37;
  --accent-cyan:#00E5FF;
  --particle:#222222;
  --shadow-soft:0 0 40px rgba(0,0,0,0.08);
  --shadow-strong:0 0 80px rgba(0,0,0,0.12);
  --radius-xl:24px;
  --radius-full:9999px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Rajdhani',sans-serif;
  background:linear-gradient(135deg,#FFFFFF 0%,#F0F0F0 50%,#FAFAFA 100%);
  color:var(--deep-black);
  min-height:100vh;
  overflow-x:hidden;
}
.particles{
  position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;
}
.particle{
  position:absolute;background:var(--particle);border-radius:50%;opacity:0.15;
  animation:float 12s infinite ease-in-out;
}
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:0.15}
  90%{opacity:0.15}
  100%{transform:translateY(-100px) rotate(720deg);opacity:0}
}
.top-bar{
  position:fixed;top:0;left:0;right:0;padding:20px 30px;display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(20px);z-index:100;border-bottom:1px solid rgba(0,0,0,0.05);
}
.logo{
  font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,var(--deep-black),var(--accent-gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.status{
  display:flex;align-items:center;gap:10px;font-weight:600;
}
.status-dot{
  width:10px;height:10px;background:#00C853;border-radius:50%;animation:pulse 2s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(0,200,83,0.4)}
  50%{box-shadow:0 0 0 10px rgba(0,200,83,0)}
}
.container{
  max-width:1400px;margin:0 auto;padding:120px 20px 60px;position:relative;z-index:10;
}
.hero{
  text-align:center;margin-bottom:50px;
}
.hero h1{
  font-family:'Orbitron',sans-serif;font-size:clamp(32px,7vw,64px);font-weight:900;
  margin-bottom:15px;letter-spacing:3px;
}
.hero span{
  background:linear-gradient(90deg,#000 0%,#444 50%,#000 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{font-size:20px;opacity:0.7;max-width:600px;margin:0 auto}
.input-card{
  background:#FFFFFF;border-radius:var(--radius-xl);padding:35px;box-shadow:var(--shadow-soft);
  margin-bottom:40px;border:1px solid rgba(0,0,0,0.05);
}
.mode-tabs{
  display:flex;gap:15px;margin-bottom:25px;flex-wrap:wrap;
}
.mode-tab{
  padding:12px 28px;border-radius:var(--radius-full);border:none;background:transparent;
  font-size:16px;font-weight:700;cursor:pointer;transition:all 0.3s ease;
  border:2px solid transparent;
}
.mode-tab.active{
  background:var(--deep-black);color:white;border-color:var(--deep-black);
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
}
.mode-tab:hover:not(.active){
  border-color:rgba(0,0,0,0.2);background:rgba(0,0,0,0.02);
}
textarea{
  width:100%;min-height:140px;padding:25px;border-radius:16px;border:2px solid #E5E5E5;
  font-size:17px;font-family:'Rajdhani',sans-serif;resize:none;transition:all 0.3s ease;
  background:#FAFAFA;
}
textarea:focus{
  outline:none;border-color:var(--deep-black);background:white;box-shadow:0 0 0 4px rgba(0,0,0,0.05);
}
.controls{
  display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;align-items:center;
}
.select-wrapper{flex:1;min-width:180px}
label{font-weight:700;display:block;margin-bottom:8px;font-size:14px;text-transform:uppercase;letter-spacing:1px;opacity:0.6}
select,button{
  width:100%;padding:15px 20px;border-radius:12px;font-size:16px;font-weight:600;border:none;cursor:pointer;
  transition:all 0.3s ease;font-family:'Rajdhani',sans-serif;
}
select{
  background:#F5F5F5;border:2px solid #E5E5E5;
}
select:focus{outline:none;border-color:var(--deep-black)}
.generate-btn{
  background:linear-gradient(135deg,var(--deep-black) 0%,#333 100%);color:white;
  padding:15px 50px;font-size:18px;font-weight:800;letter-spacing:1px;
  box-shadow:0 6px 25px rgba(0,0,0,0.25);min-width:220px;
}
.generate-btn:hover{
  transform:translateY(-2px);box-shadow:0 10px 35px rgba(0,0,0,0.35);
}
.generate-btn:disabled{opacity:0.5;transform:none;cursor:not-allowed}
.output-section{
  background:#FFFFFF;border-radius:var(--radius-xl);padding:35px;box-shadow:var(--shadow-soft);
  border:1px solid rgba(0,0,0,0.05);
}
.output-header{
  display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;
}
.output-header h2{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:800}
.download-btn{
  background:transparent;border:2px solid var(--deep-black);color:var(--deep-black);
  padding:10px 25px;border-radius:var(--radius-full);font-weight:700;
}
.download-btn:hover{background:var(--deep-black);color:white}
.output-placeholder{
  aspect-ratio:16/9;background:linear-gradient(135deg,#F5F5F5,#EAEAEA);border-radius:16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#888;padding:40px;text-align:center;
}
.output-placeholder svg{width:80px;height:80px;margin-bottom:20px;opacity:0.3}
.result-media{
  width:100%;border-radius:16px;display:none;
}
.loading-state{
  display:none;text-align:center;padding:40px;
}
.loading-bar{
  width:100%;height:6px;background:#E5E5E5;border-radius:3px;overflow:hidden;margin:20px 0;
}
.loading-fill{
  height:100%;background:linear-gradient(90deg,var(--deep-black),var(--accent-gold));
  width:0%;transition:width 0.5s ease;
}
.hidden{display:none !important}
.tip-box{
  margin-top:25px;padding:20px;background:rgba(0,0,0,0.02);border-radius:12px;border-left:4px solid var(--accent-gold);
}
.tip-box strong{color:var(--deep-black)}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<nav class="top-bar">
  <div class="logo">VECTOR AI</div>
  <div class="status">
    <span class="status-dot"></span>
    <span>SYSTEM ONLINE</span>
  </div>
</nav>

<main class="container">
  <div class="hero">
    <h1><span>AI GENERATOR</span></h1>
    <p>Ultra-Realistic • Image & Video • Your Personal Studio</p>
  </div>

  <div class="input-card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="image">📷 Image</button>
      <button class="mode-tab" data-mode="video">🎬 Video</button>
    </div>

    <textarea id="promptInput" placeholder="Describe exactly what you want — style, lighting, mood, details..."></textarea>

    <div class="controls">
      <div class="select-wrapper">
        <label>Style</label>
        <select id="styleSelect">
          <option value="realistic">Ultra-Realistic</option>
          <option value="cinematic">Cinematic / Film</option>
          <option value="anime">Anime / Art</option>
          <option value="3d">3D / Render</option>
          <option value="photorealistic">Photorealistic</option>
        </select>
      </div>
      <div class="select-wrapper">
        <label>Quality</label>
        <select id="qualitySelect">
          <option value="standard">Standard</option>
          <option value="high" selected>High Definition</option>
          <option value="ultra">Ultra HD / 4K</option>
        </select>
      </div>
      <button class="generate-btn" id="generateBtn">✨ GENERATE</button>
    </div>
  </div>

  <div class="output-section">
    <div class="output-header">
      <h2>OUTPUT</h2>
      <button class="download-btn hidden" id="downloadBtn">⬇️ DOWNLOAD</button>
    </div>

    <div class="output-placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <p>Your creation appears here</p>
    </div>

    <img id="resultImage" class="result-media" alt="Generated result">
    <video id="resultVideo" class="result-media" controls loop muted></video>

    <div class="loading-state" id="loadingState">
      <p id="loadingText">Initializing neural engine...</p>
      <div class="loading-bar"><div class="loading-fill" id="loadingFill"></div></div>
    </div>

    <div class="tip-box" id="tipBox">
      <strong>💡 Pro Tip:</strong> Be specific — include lighting, camera angle, mood, and details for best results.
    </div>
  </div>
</main>

<script>
// === PARTICLE SYSTEM ===
const particlesContainer = document.getElementById('particles');
for(let i=0; i<60; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const size = Math.random()*4+1;
  p.style.width = p.style.height = size+'px';
  p.style.left = Math.random()*100+'%';
  p.style.animationDelay = Math.random()*12+'s';
  p.style.animationDuration = (Math.random()*8+8)+'s';
  particlesContainer.appendChild(p);
}

// === MODE SWITCHING ===
let currentMode = 'image';
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMode = tab.dataset.mode;
    resetOutput();
  });
});

// === GENERATION LOGIC ===
const promptInput = document.getElementById('promptInput');
const generateBtn = document.getElementById('generateBtn');
const placeholder = document.getElementById('placeholder');
const loadingState = document.getElementById('loadingState');
const loadingFill = document.getElementById('loadingFill');
const loadingText = document.getElementById('loadingText');
const resultImage = document.getElementById('resultImage');
const resultVideo = document.getElementById('resultVideo');
const downloadBtn = document.getElementById('downloadBtn');

function resetOutput(){
  placeholder.classList.remove('hidden');
  loadingState.style.display = 'none';
  resultImage.style.display = 'none';
  resultVideo.style.display = 'none';
  downloadBtn.classList.add('hidden');
  loadingFill.style.width = '0%';
}

async function runGeneration(){
  const prompt = promptInput.value.trim();
  if(!prompt){ alert('Type something first!'); return; }

  resetOutput();
  placeholder.classList.add('hidden');
  loadingState.style.display = 'block';
  generateBtn.disabled = true;

  // Simulate smart generation steps
  const steps = [
    'Analyzing prompt details...',
    'Loading ultra-realistic model...',
    'Rendering high-fidelity details...',
    'Optimizing resolution & lighting...',
    'Finalizing output...'
  ];
  
  for(let i=0; i<steps.length; i++){
    loadingText.textContent = steps[i];
    loadingFill.style.width = ((i+1)/steps.length*100)+'%';
    await new Promise(r => setTimeout(r, 600 + Math.random()*400));
  }

  // Demo: Use placeholder image from service
  const encoded = encodeURIComponent(prompt);
  if(currentMode === 'image'){
    resultImage.src = `https://picsum.photos/seed/${btoa(prompt).slice(0,8)}/1024/768`;
    resultImage.onload = () => {
      loadingState.style.display = 'none';
      resultImage.style.display = 'block';
      downloadBtn.classList.remove('hidden');
      downloadBtn.onclick = () => window.open(resultImage.src, '_blank');
    };
  } else {
    // Video mode — show message + demo placeholder
    loadingState.style.display = 'none';
    placeholder.classList.remove('hidden');
    placeholder.innerHTML = `
      <strong>🎬 Video Mode Ready</strong><br>
      Connect an API key (Replicate / Runway) for real video generation.<br>
      Image mode works instantly for free right now ✅
    `;
  }

  generateBtn.disabled = false;
}

generateBtn.addEventListener('click', runGeneration);
promptInput.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); runGeneration(); }
});
</script>
</body>
</html>
